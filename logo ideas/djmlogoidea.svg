<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="DJM monogram in rectangular frame">
  <defs>
    <style>
      :root{
        --ink:#000;
        --bg:#fff;
        --stroke:44; /* main letter stroke */
        --frame:28;  /* frame stroke */
      }
      .bg{ fill:var(--bg); }
      .frame{
        fill:none;
        stroke:var(--ink);
        stroke-width:var(--frame);
        stroke-linejoin:miter;
      }
      .mono{
        fill:none;
        stroke:var(--ink);
        stroke-width:var(--stroke);
        stroke-linecap:square;
        stroke-linejoin:miter;
      }
    </style>
  </defs>

  <!-- background (white) -->
  <rect class="bg" x="0" y="0" width="1200" height="600"/>

  <!-- FRAME: strong rectangle, generous padding -->
  <rect class="frame" x="80" y="80" width="1040" height="440"/>

  <!--
  Grid + geometry notes:
  - Content box inside frame: (80..1120, 80..520)
  - Visual padding for letters: ~90px from frame
  - Monogram is three bold monoline glyphs with consistent stroke width
  - All angles are orthogonal (0/90 degrees) for a clean, serious mark
  -->

  <!-- DJM -->
  <g transform="translate(0,0)">
    <!-- D -->
    <!-- Left stem + top/bottom + right stem to imply D (bold, squared) -->
    <path class="mono" d="
      M 210 190
      L 210 410

      M 210 190
      L 330 190

      M 330 190
      L 330 410

      M 210 410
      L 330 410
    "/>

    <!-- J -->
    <!-- Top bar + vertical + bottom hook to the left -->
    <path class="mono" d="
      M 470 190
      L 610 190

      M 610 190
      L 610 360

      M 610 410
      L 520 410

      M 610 360
      L 610 410
    "/>

    <!-- hook (leftward) -->
    <path class="mono" d="
      M 520 410
      L 520 410
      L 520 410
    "/>

    <!-- Make the J feel intentional: add a short vertical down on left end -->
    <path class="mono" d="
      M 520 410
      L 520 388
    "/>

    <!-- M -->
    <!-- Two stems + inner diagonals (kept sharp and symmetrical) -->
    <path class="mono" d="
      M 730 410
      L 730 190

      M 730 190
      L 820 320

      M 820 320
      L 910 190

      M 910 190
      L 910 410
    "/>
  </g>

  <!-- Optional: tighten the J hook by adding a small leftward foot (keeps it bold, not cute) -->
  <path class="mono" d="M 520 410 L 485 410" />

</svg>